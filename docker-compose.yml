services:
  wenfeng-kitchen:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: wenfeng-kitchen
    ports:
      - "8080:8080"
    environment:
      - PUBLIC_DIR=/app/public
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./server/data:/app/data
      - ./server/uploads:/app/uploads
    restart: unless-stopped
