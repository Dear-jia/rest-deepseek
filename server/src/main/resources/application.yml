server:
  # Render 等平台会注入 PORT 环境变量；本地未设置时默认 8080
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: wenfeng-kitchen
  datasource:
    # 默认本地 H2 文件库；设置 DATABASE_URL 后自动切换为 PostgreSQL（如 Neon/Supabase/Render 数据库）
    url: ${DATABASE_URL:jdbc:h2:file:./data/wenfeng}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      # 默认关闭 H2 控制台（可执行任意 SQL 的高危入口），本地调试时设置 H2_CONSOLE=true 开启
      enabled: ${H2_CONSOLE:false}
      path: /h2-console
  web:
    resources:
      # 前台静态页面默认从项目根目录读取（本地运行），部署时用 PUBLIC_DIR 指向
      static-locations: classpath:/static/,file:${app.public-dir}/
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  thymeleaf:
    cache: false
  jackson:
    time-zone: Asia/Shanghai

app:
  ai:
    # AI 女仆小助手：接入任意 OpenAI 兼容的 /chat/completions 接口
    # 免费推荐：智谱 GLM-4-Flash（bigmodel.cn）或 硅基流动（siliconflow.cn）
    base-url: ${AI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:glm-4-flash}
    max-tokens: ${AI_MAX_TOKENS:500}
    system-prompt: "你是「樱梦女仆咖啡厅」的 AI 女仆小助手「樱子」。请用非常温柔、体贴、软软的语气轻声回答客人，像邻家女孩一样贴心，可以自然使用“主人”“呢”“呀”“哦”等语气词，但不要过度撒娇或啰嗦。围绕这些内容回答：菜单、预约、营业时间、地址、优惠活动、会员抽奖。回答控制在 120 字以内；不知道的事情，就温柔地请客人到店或致电 0731-8888-6666 咨询。"
  auth:
    # 登录态 Cookie 签名密钥；生产环境务必通过 AUTH_SECRET 环境变量设置强随机值
    secret: ${AUTH_SECRET:dev-only-secret-please-change-2026-wenfeng}
  # 前台页面目录：本地为 ../../（相对 server 运行目录的上级），Docker 中设为 /app/public
  public-dir: ${PUBLIC_DIR:../}
  admin:
    username: ${ADMIN_USER:admin}
    # 留空/未配置时，首次启动会生成随机密码并打印到日志，且强制首次登录修改
    password: ${ADMIN_PASSWORD:}
