server:
  # Render 等平台会注入 PORT 环境变量；本地未设置时默认 8080
  port: ${PORT:8080}

spring:
  application:
    name: wenfeng-kitchen
  datasource:
    # 默认本地 H2 文件库；设置 DATABASE_URL 后自动切换为 PostgreSQL（如 Neon/Supabase/Render 数据库）
    url: ${DATABASE_URL:jdbc:h2:file:./data/wenfeng}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      # 前台静态页面默认从项目根目录读取（本地运行），部署时用 PUBLIC_DIR 指向
      static-locations: classpath:/static/,file:${app.public-dir}/
  thymeleaf:
    cache: false

app:
  # 前台页面目录：本地为 ../../（相对 server 运行目录的上级），Docker 中设为 /app/public
  public-dir: ${PUBLIC_DIR:../}
  admin:
    username: ${ADMIN_USER:admin}
    password: ${ADMIN_PASSWORD:admin123}
