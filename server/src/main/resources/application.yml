server:
  port: 8080

spring:
  application:
    name: wenfeng-kitchen
  datasource:
    url: jdbc:h2:file:./data/wenfeng;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      # 前台静态页面默认从项目根目录读取（本地运行），部署时用 PUBLIC_DIR 指向
      static-locations: classpath:/static/,file:${app.public-dir}/
  thymeleaf:
    cache: false

app:
  # 前台页面目录：本地为 ../../（相对 server 运行目录的上级），Docker 中设为 /app/public
  public-dir: ${PUBLIC_DIR:../}
  admin:
    username: ${ADMIN_USER:admin}
    password: ${ADMIN_PASSWORD:admin123}
