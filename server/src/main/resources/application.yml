server:
  # Render 等平台会注入 PORT 环境变量；本地未设置时默认 8080
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: wenfeng-kitchen
  datasource:
    # 默认本地 H2 文件库；设置 DATABASE_URL 后自动切换为 PostgreSQL（如 Neon/Supabase/Render 数据库）
    url: ${DATABASE_URL:jdbc:h2:file:./data/wenfeng}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      # 默认关闭 H2 控制台（可执行任意 SQL 的高危入口），本地调试时设置 H2_CONSOLE=true 开启
      enabled: ${H2_CONSOLE:false}
      path: /h2-console
  web:
    resources:
      # 前台静态页面默认从项目根目录读取（本地运行），部署时用 PUBLIC_DIR 指向；uploads 为上传目录
      static-locations: classpath:/static/,file:${app.public-dir}/,file:${app.upload-dir}/
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  thymeleaf:
    cache: false
  jackson:
    time-zone: Asia/Shanghai

app:
  # 女仆照片等上传文件的存放目录（本地为 server/uploads，Docker 用 /app/uploads）
  upload-dir: ${UPLOAD_DIR:./uploads}
  auth:
    # 登录态 Cookie 签名密钥；生产环境务必通过 AUTH_SECRET 环境变量设置强随机值
    secret: ${AUTH_SECRET:dev-only-secret-please-change-2026-wenfeng}
  # 前台页面目录：本地为 ../../（相对 server 运行目录的上级），Docker 中设为 /app/public
  public-dir: ${PUBLIC_DIR:../}
  admin:
    username: ${ADMIN_USER:admin}
    # 留空/未配置时，首次启动会生成随机密码并打印到日志，且强制首次登录修改
    password: ${ADMIN_PASSWORD:}
