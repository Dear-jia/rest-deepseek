<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments :: head('用户登录')"></head>
<body>
<div class="login-wrap">
  <form class="login-card" th:action="@{/user/login}" method="post">
    <h1>文峰小馆 · 用户登录</h1>
    <p>登录后可充值、抽奖、领优惠券、发表评价</p>
    <p class="err" th:if="${registered}">注册成功，请登录</p>
    <p class="err" th:if="${error}">账号或密码错误，或该账号已被临时锁定</p>
    <p class="err" th:if="${logout}">您已安全退出</p>
    <input type="text" name="username" placeholder="用户名" autofocus required>
    <input type="password" name="password" placeholder="密码" required>
    <button type="submit">登 录</button>
    <p style="text-align:center;margin:14px 0 0;font-size:13px;">
      还没有账号？<a href="/user/register">立即注册</a>
    </p>
  </form>
</div>
</body>
</html>
