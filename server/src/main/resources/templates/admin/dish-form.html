<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments :: head('菜品编辑')"></head>
<body>
<header th:replace="admin/fragments :: topbar('dishes')"></header>
<main>
  <div class="panel">
    <div class="panel-head">
      <h2 th:text="${isNew} ? '新增菜品' : '编辑菜品'">菜品</h2>
      <a class="btn btn-ghost" href="/admin/dishes">返回列表</a>
    </div>
    <form th:action="${isNew} ? @{/admin/dishes} : @{/admin/dishes/{id}(id=${dish.id})}" method="post"
          th:object="${dish}">
      <div class="form-grid">
        <div class="field">
          <label>菜名（中文）*</label>
          <input type="text" th:field="*{name}" required placeholder="如：宫保鸡丁">
        </div>
        <div class="field">
          <label>英文名</label>
          <input type="text" th:field="*{nameEn}" placeholder="如：Kung Pao Chicken">
        </div>
        <div class="field">
          <label>价格（元）*</label>
          <input type="number" step="0.01" min="0" th:field="*{price}" required>
        </div>
        <div class="field">
          <label>分类 *</label>
          <select th:field="*{category}" required>
            <option value="HOT">招牌热菜</option>
            <option value="MAIN">主食与汤品</option>
            <option value="DRINK">甜品与饮品</option>
          </select>
        </div>
        <div class="field">
          <label>标签（可选）</label>
          <input type="text" th:field="*{tag}" placeholder="如：招牌 / 人气 / 必点">
        </div>
        <div class="field">
          <label>排序号（小的在前）</label>
          <input type="number" th:field="*{sortOrder}">
        </div>
        <div class="field full">
          <label>图片路径</label>
          <input type="text" th:field="*{image}" placeholder="assets/img/xxx.jpg（留空则前台不显示图片）">
          <span class="hint">图片放在仓库 assets/img/ 目录下，这里填相对路径；也可直接填外部图片 URL。</span>
        </div>
        <div class="field full">
          <label>描述</label>
          <textarea th:field="*{description}" rows="3" placeholder="一句话介绍这道菜"></textarea>
        </div>
        <div class="field">
          <label><input type="checkbox" th:field="*{recommended}"> 在首页「招牌菜」区域展示</label>
        </div>
        <div class="field">
          <label><input type="checkbox" th:field="*{enabled}"> 上架（前台可见）</label>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="submit">保存</button>
        <a class="btn btn-ghost" href="/admin/dishes">取消</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
