<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments :: head('用户管理')"></head>
<body>
<header th:replace="admin/fragments :: topbar('users')"></header>
<main>
  <div class="flash" th:if="${flash}" th:text="${flash}">提示</div>
  <p class="err" style="background:#fbe9e6;border:1px solid #f2c4bc;color:#a13022;padding:12px 16px;border-radius:10px;margin-bottom:18px;"
     th:if="${error}" th:text="${error}">错误</p>
  <div class="panel">
    <div class="panel-head">
      <h2>注册用户</h2>
      <span class="muted">共 <b th:text="${#lists.size(customers)}">0</b> 人</span>
    </div>
    <table>
      <tr>
        <th>ID</th><th>用户名</th><th>昵称</th><th>手机号</th><th>余额</th><th>注册时间</th><th>调整余额</th>
      </tr>
      <tr th:each="c : ${customers}">
        <td th:text="${c.id}">-</td>
        <td th:text="${c.username}">-</td>
        <td th:text="${c.nickname}">-</td>
        <td th:text="${c.phone ?: '-'}">-</td>
        <td th:text="'¥' + ${c.balance}">-</td>
        <td th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}">-</td>
        <td>
          <form class="inline" method="post" th:action="@{/admin/users/{id}/balance(id=${c.id})}" style="display:flex;gap:6px;align-items:center;">
            <input type="number" name="amount" step="0.01" placeholder="如 50 或 -20" required
                   style="width:110px;padding:7px 9px;border:1px solid #ddd2bd;border-radius:8px;font-size:13px;">
            <input type="text" name="note" placeholder="备注" style="width:110px;padding:7px 9px;border:1px solid #ddd2bd;border-radius:8px;font-size:13px;">
            <button class="btn btn-primary btn-sm" type="submit">调整</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(customers)}">
        <td colspan="7" class="muted">还没有注册用户。</td>
      </tr>
    </table>
  </div>
</main>
</body>
</html>
