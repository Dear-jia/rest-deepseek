<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments :: head('成员编辑')"></head>
<body>
<header th:replace="admin/fragments :: topbar('staff')"></header>
<main>
  <div class="panel">
    <div class="panel-head">
      <h2 th:text="${isNew} ? '新增女仆 / 主厨' : '编辑成员'">成员</h2>
      <a class="btn btn-ghost" href="/admin/staff">返回列表</a>
    </div>
    <form th:action="${isNew} ? @{/admin/staff} : @{/admin/staff/{id}(id=${staff.id})}" method="post"
          enctype="multipart/form-data" th:object="${staff}">
      <div class="form-grid">
        <div class="field">
          <label>姓名 *</label>
          <input type="text" th:field="*{name}" required placeholder="如：小樱">
        </div>
        <div class="field">
          <label>职位</label>
          <input type="text" th:field="*{role}" placeholder="如：女仆长 / 甜品主厨 / 咖啡师">
        </div>
        <div class="field full">
          <label>照片上传（jpg/png/webp/gif，≤5MB）</label>
          <input type="file" name="image" accept="image/jpeg,image/png,image/webp,image/gif">
          <span class="hint">不选择则保留当前照片；未上传过照片时前台显示名字头像。</span>
          <img th:if="${!isNew and staff.image != null}" th:src="${staff.image}" alt="当前照片"
               style="width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid #ffd7e8;margin-top:8px;">
        </div>
        <div class="field full">
          <label>简介</label>
          <textarea th:field="*{description}" rows="3" placeholder="一句话介绍这位成员"></textarea>
        </div>
        <div class="field">
          <label>排序号（小的在前）</label>
          <input type="number" th:field="*{sortOrder}">
        </div>
        <div class="field">
          <label><input type="checkbox" th:field="*{enabled}"> 在首页展示</label>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="submit">保存</button>
        <a class="btn btn-ghost" href="/admin/staff">取消</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
