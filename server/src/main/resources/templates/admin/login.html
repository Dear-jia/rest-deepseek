<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments :: head('登录')"></head>
<body>
<div class="login-wrap">
  <form class="login-card" th:action="@{/admin/login}" method="post">
    <h1>文峰小馆 · 后台管理</h1>
    <p>请输入管理员账号登录</p>
    <p class="err" th:if="${error}">账号或密码错误，请重试</p>
    <p class="err" th:if="${logout}">您已安全退出</p>
    <input type="text" name="username" placeholder="用户名" autofocus required>
    <input type="password" name="password" placeholder="密码" required>
    <button type="submit">登 录</button>
  </form>
</div>
</body>
</html>
