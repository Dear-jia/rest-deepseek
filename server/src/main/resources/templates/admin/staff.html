<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments :: head('女仆管理')"></head>
<body>
<header th:replace="admin/fragments :: topbar('staff')"></header>
<main>
  <div class="flash" th:if="${flash}" th:text="${flash}">提示</div>
  <p class="err" style="background:#fbe9e6;border:1px solid #f2c4bc;color:#a13022;padding:12px 16px;border-radius:10px;margin-bottom:18px;"
     th:if="${error}" th:text="${error}">错误</p>
  <div class="panel">
    <div class="panel-head">
      <h2>女仆与主厨</h2>
      <a class="btn btn-primary" href="/admin/staff/new">＋ 新增成员</a>
    </div>
    <table>
      <tr>
        <th>排序</th><th>照片</th><th>姓名</th><th>职位</th><th>简介</th><th>状态</th><th>操作</th>
      </tr>
      <tr th:each="s : ${staffList}">
        <td th:text="${s.sortOrder}">0</td>
        <td>
          <img class="thumb" style="width:54px;height:54px;border-radius:50%;" th:if="${s.image != null}" th:src="${s.image}" alt="">
          <span th:if="${s.image == null}" class="muted">未上传</span>
        </td>
        <td><strong th:text="${s.name}">-</strong></td>
        <td th:text="${s.role ?: '-'}">-</td>
        <td style="max-width:320px;" th:text="${s.description ?: '-'}">-</td>
        <td>
          <span class="badge" th:classappend="${s.enabled} ? 'badge-confirmed' : 'badge-cancelled'"
                th:text="${s.enabled} ? '展示中' : '已隐藏'">-</span>
        </td>
        <td>
          <a class="btn btn-ghost btn-sm" th:href="@{/admin/staff/{id}/edit(id=${s.id})}">编辑</a>
          <form class="inline" method="post" th:action="@{/admin/staff/{id}/toggle(id=${s.id})}">
            <button class="btn btn-sm" th:classappend="${s.enabled} ? 'btn-ghost' : 'btn-success'" type="submit"
                    th:text="${s.enabled} ? '隐藏' : '展示'">-</button>
          </form>
          <form class="inline" method="post" th:action="@{/admin/staff/{id}/delete(id=${s.id})}">
            <button class="btn btn-danger btn-sm" type="submit"
                    onclick="return confirm('确定删除「' + '${s.name}' + '」吗？其照片也会一并删除。');">删除</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(staffList)}">
        <td colspan="7" class="muted">还没有成员，点击右上角「新增成员」添加。</td>
      </tr>
    </table>
  </div>
</main>
</body>
</html>
